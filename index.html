<!DOCTYPE html><html dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Face Mezguitem</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f0f2f5;font-family:Arial}header{background:#1877f2;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold} .container{max-width:600px;margin:15px auto;padding:10px}.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 1px 2px #0003}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;font-size:16px}button{background:#1877f2;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold}</style></head><body><header>📘 Face Mezguitem - CLOUD</header><div class=container><div class=card><input id=nameInput placeholder=Smiytek...><textarea id=postInput rows=3 placeholder="Ach katfeker?"></textarea><button onclick=addPost()>Ncher 🚀</button><div id=status style=text-align:center;color:#65676b;padding:8px>Kaytchargaw...</div></div><div id=posts></div></div><script>const DB_URL="https://face-mezguitem-dddaa-default-rtdb.firebaseio.com";async function addPost(){const t=document.getElementById('postInput').value.trim(),n=document.getElementById('nameInput').value.trim()||"Weld Mezguitem";if(!t)return alert("Kteb chi haja!");document.getElementById('status').innerText="Kaytncher...";await fetch(`${DB_URL}/posts.json`,{method:'POST',body:JSON.stringify({author:n,text:t,time:new Date().toLocaleString('ar-MA'),timestamp:Date.now(),likes:0})});document.getElementById('postInput').value="";loadPosts()}async function loadPosts(){const r=await fetch(`${DB_URL}/posts.json`),d=await r.json(),c=document.getElementById('posts');c.innerHTML="";if(!d){document.getElementById('status').innerText="Mazal 0 posts!";return}document.getElementById('status').innerText=Object.keys(d).length+" posts";Object.entries(d).map(([id,p])=>({id,...p})).sort((a,b)=>b.timestamp-a.timestamp).forEach(p=>{const e=document.createElement('div');e.className='card';e.innerHTML=`<b>${p.author}</b><br><small>${p.time}</small><div style=margin:10px 0;white-space:pre-wrap>${p.text.replace(/</g,'&lt;')}</div><button style=background:#e4e6eb;color:#000 onclick=likePost('${p.id}',${p.likes||0})>👍 ${p.likes||0}</button>`;c.appendChild(e)})}async function likePost(id,l){await fetch(`${DB_URL}/posts/${id}.json`,{method:'PATCH',body:JSON.stringify({likes:l+1})});loadPosts()}loadPosts();setInterval(loadPosts,5000)</script></body></html>
