<!DOCTYPE html><html dir=rtl lang=ar><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Mezguitem - كتاب الذاكرة</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#fdf8f0;color:#3a2e2a;padding:12px}h1{text-align:center;color:#8B4513;margin:12px 0}button{padding:10px 14px;border:none;border-radius:8px;background:#8B4513;color:#fff;font-weight:700;margin:4px;cursor:pointer}input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}textarea{min-height:80px}#grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.card img{width:100%;border-radius:8px;margin-bottom:8px;max-height:260px;object-fit:cover}.bar{display:flex;flex-wrap:wrap;justify-content:center;margin:10px 0}</style></head><body><h1>📖 Mezguitem - كتاب الذاكرة الجماعية</h1><div class=bar><button onclick="show('add')">➕ إضافة ذكرى + صورة</button><button onclick="show('all')">📚 كل الذكريات</button><button onclick="exportData()">💾 حفظ</button></div><div id=add style=display:none class=card><h3>إضافة ذكرى جديدة مع صورة</h3><input id=t placeholder="العنوان - مثلا: عيد الحصاد"><textarea id=d placeholder="احكي القصة هنا..."></textarea><input id=a placeholder="اسمك (اختياري)"><label>📸 اختر صورة من الهاتف:</label><input type=file id=img accept="image/*"><div id=prev></div><button onclick="save()">✅ نشر الذكرى</button></div><div id=grid></div><script>let mems=JSON.parse(localStorage.getItem('mez_v2')||'[]');let curImg='';document.getElementById('img').addEventListener('change',e=>{let f=e.target.files[0]; if(!f) return;let r=new FileReader(); r.onload=ev=>{curImg=ev.target.result; document.getElementById('prev').innerHTML=`<img src="${curImg}" style="width:100%;border-radius:8px;margin-top:8px">`}; r.readAsDataURL(f);});function show(v){document.getElementById('add').style.display=v=='add'?'block':'none'; if(v=='all') render()}function save(){let t=document.getElementById('t').value.trim(), d=document.getElementById('d').value.trim(), a=document.getElementById('a').value.trim(); if(!t||!d) return alert('كتب العنوان والقصة');mems.unshift({t,d,a,img:curImg,date:new Date().toLocaleDateString('ar-MA')});localStorage.setItem('mez_v2',JSON.stringify(mems));document.getElementById('t').value='';document.getElementById('d').value='';document.getElementById('a').value='';document.getElementById('prev').innerHTML='';curImg='';alert('تمت الإضافة! ✅'); render();}function render(){let g=document.getElementById('grid'); if(mems.length==0){g.innerHTML='<div class=card>لا توجد ذكريات بعد - أضف أول ذكرى مع صورة!</div>';return}g.innerHTML=mems.map((m,i)=>`<div class=card>${m.img?`<img src="${m.img}">`:''}<h3>${m.t}</h3><p>${m.d}</p><small>📅 ${m.date} ${m.a?' - ✍️ '+m.a:''}</small><br><button onclick="del(${i})" style="background:#c0392b;margin-top:8px">حذف</button></div>`).join('');}function del(i){if(confirm('تمسح؟')){mems.splice(i,1);localStorage.setItem('mez_v2',JSON.stringify(mems));render()}}function exportData(){let b=new Blob([JSON.stringify(mems)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='mezguitem.json';a.click()}render();</script></body></html>
